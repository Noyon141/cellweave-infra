# Reusable CI Template for cellweave-web (Pull Requests)
# Implements Section 99: install -> lint -> format -> typecheck -> unit tests -> authorization tests -> DB migration validation -> build -> Playwright smoke -> preview

name: Web CI (PR Gate)

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test:unit

      - name: Cross-Tenant Authorization Tests
        run: pnpm test:auth

      - name: Database Migration Safety Check
        run: pnpm test:migrations

      - name: Next.js Production Build
        run: pnpm build

      - name: Playwright Smoke Tests
        run: pnpm test:e2e:smoke
