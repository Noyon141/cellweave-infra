services:
  postgres:
    image: postgres:16-alpine
    container_name: cellweave-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cellweave
      POSTGRES_PASSWORD: cellweave_local_password
      POSTGRES_DB: cellweave_dev
    ports:
      - "5432:5432"
    volumes:
      - cellweave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellweave -d cellweave_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: cellweave-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cellweave_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-31-50Z
    container_name: cellweave-local-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/cellweave-artifacts-local --ignore-existing;
      exit 0;
      "

  temporal:
    image: temporalio/admin-tools:1.24.2
    container_name: cellweave-local-temporal-dev
    restart: unless-stopped
    entrypoint: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  cellweave_postgres_data:
  cellweave_minio_data:
